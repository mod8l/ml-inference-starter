apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: inference
  namespace: inference
  labels:
    app.kubernetes.io/name: inference
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: inference
  namespaceSelector:
    matchNames:
      - inference
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
